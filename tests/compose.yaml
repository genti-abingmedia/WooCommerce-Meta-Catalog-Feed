services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: wcmcf-test-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wcmcf-test-password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - database:/var/lib/mysql
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WCMCF_TEST_PORT:-18086}:80"
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wcmcf-test-password
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wordpress:/var/www/html
      - ../woocommerce-meta-catalog-feed:/var/www/html/wp-content/plugins/woocommerce-meta-catalog-feed:ro
      - ./:/opt/wcmcf-tests:ro
volumes:
  wordpress:
  database:
